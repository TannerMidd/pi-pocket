# Checks Pi Pocket on macOS for each pull request. It publishes nothing.
# - installer: on Apple silicon and on Intel, builds the package (packaging/macos) with the package of this checkout
#   in it, then blocks npm, as a company network can: the install and Pi Pocket must work without it. It installs it
#   for the current user without sudo, starts the console launcher without its menu, checks that it answers HTTP and
#   that the sign-in link works, and uninstalls it while it runs, which must stop it and keep the data folder. Then it
#   installs it again with the sign-in item and opens Pi Pocket.app: no Terminal, a server on this Mac only, a window
#   that signed in with a one-time link, one instance only, and Quit that stops it all. An older package makes the app
#   show its error and start nothing, and an install puts its own package back; a newer one stays. It starts the
#   sign-in item (the app in the menu bar only), installs over the running Pi Pocket (which keeps the sign-in item),
#   and uninstalls it with the data.
# - checks: the type check and the test suite, without the tests that do not pass on macOS yet (docs/macos.md says
#   which, and why).
name: macOS

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: macos-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    installer:
        name: Installer (${{ matrix.arch }})
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      arch: arm64
                    - runner: macos-15-intel
                      arch: x86_64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26

            - name: Read the version
              run: |
                  version="$(node -p "require('./package.json').version")"
                  {
                      echo "VERSION=$version"
                      echo "MANIFEST=$HOME/Library/Application Support/Pi Pocket/app/lib/node_modules/pi-pocket/package.json"
                      echo "PKG=$RUNNER_TEMP/pkg/Pi-Pocket-$version.pkg"
                      echo "APP=$HOME/Library/Application Support/Pi Pocket"
                      echo "BUNDLE=$HOME/Applications/Pi Pocket.app"
                      echo "CONSOLE=$HOME/Applications/Pi Pocket (console).app"
                      echo "LOG=$HOME/Library/Logs/Pi Pocket/launcher.log"
                      echo "RUNNING=$HOME/.pi-pocket/launcher-running.json"
                      echo "AGENT=$HOME/Library/LaunchAgents/io.github.tannermidd.pi-pocket.plist"
                  } >> "$GITHUB_ENV"

            - name: Build the package
              run: |
                  packaging/macos/build.sh "$VERSION" "$RUNNER_TEMP/pkg"
                  echo "The package is $(du -h "$PKG" | cut -f 1)"

            - name: Check the package
              run: |
                  domains="$(installer -pkg "$PKG" -dominfo)"
                  echo "$domains"
                  if [ "$domains" != "CurrentUserHomeDirectory" ]; then
                      echo "The package must install in the home folder only"
                      exit 1
                  fi
                  pkgutil --check-signature "$PKG" || true
                  installer -pkg "$PKG" -target CurrentUserHomeDirectory -showChoicesXML > "$RUNNER_TEMP/choices-shown.plist"
                  plutil -p "$RUNNER_TEMP/choices-shown.plist"

            # From here on, nothing reaches npm's registry: its names point to this Mac, where nothing listens, and npm
            # gets an address that refuses.
            - name: Block npm, as a company network can
              run: |
                  printf '\n127.0.0.1 registry.npmjs.org\n127.0.0.1 registry.npmjs.com\n::1 registry.npmjs.org\n::1 registry.npmjs.com\n' | sudo tee -a /etc/hosts > /dev/null
                  sudo dscacheutil -flushcache
                  sudo killall -HUP mDNSResponder || true
                  echo "NPM_CONFIG_REGISTRY=http://127.0.0.1:9/" >> "$GITHUB_ENV"
                  if NPM_CONFIG_REGISTRY=http://127.0.0.1:9/ npm view pi-pocket version --fetch-retries=0 --prefer-online; then
                      echo "npm still reaches a registry"
                      exit 1
                  fi
                  if curl -s -o /dev/null --max-time 10 https://registry.npmjs.org/pi-pocket; then
                      echo "registry.npmjs.org still answers"
                      exit 1
                  fi
                  echo "registry.npmjs.org is blocked"

            - name: Install for the current user, without sudo
              run: |
                  installer -pkg "$PKG" -target CurrentUserHomeDirectory -verbose
                  cat "$APP/install.log"
                  for file in node/bin/node node/bin/npm pi-pocket "Pi Pocket.command" uninstall.sh place-app.mjs \
                      app/bin/pi-pocket app/lib/node_modules/pi-pocket/bin/pi-pocket.js; do
                      if [ ! -e "$APP/$file" ]; then
                          echo "The package did not install $file"
                          exit 1
                      fi
                  done
                  installed="$("$APP/node/bin/node" -p "require(process.argv[1]).version" "$MANIFEST")"
                  if [ "$installed" != "$VERSION" ] || [ -e "$APP/app.new" ] || [ -e "$APP/app.old" ]; then
                      echo "The package left pi-pocket $installed, not $VERSION, or app.new or app.old"
                      exit 1
                  fi
                  echo "The package installed pi-pocket $installed, with $(find "$APP/app" -type f | wc -l | tr -d ' ') files in app/"
                  if [ -e "$APP/Pi Pocket.app" ] || [ ! -x "$BUNDLE/Contents/MacOS/Pi Pocket" ]; then
                      echo "Pi Pocket.app is not in ~/Applications"
                      exit 1
                  fi
                  if [ -e "$APP/Pi Pocket (console).app" ] || [ ! -x "$CONSOLE/Contents/MacOS/Pi Pocket (console)" ]; then
                      echo "Pi Pocket (console).app is not in ~/Applications"
                      exit 1
                  fi
                  plutil -lint "$BUNDLE/Contents/Info.plist" "$CONSOLE/Contents/Info.plist"
                  archs="$(lipo -archs "$BUNDLE/Contents/MacOS/Pi Pocket")"
                  echo "Pi Pocket.app: $archs"
                  [ "$archs" = "x86_64 arm64" ] || [ "$archs" = "arm64 x86_64" ]
                  codesign --verify --strict --all-architectures --verbose=2 "$BUNDLE"
                  if [ -e "$AGENT" ]; then
                      echo "The sign-in item is there, but its choice is off by default"
                      exit 1
                  fi
                  others="$(find "$APP" "$BUNDLE" ! -user "$(id -un)" | head -5)"
                  if [ -n "$others" ]; then
                      echo "Files that the user does not own: $others"
                      exit 1
                  fi
                  lipo -archs "$APP/node/bin/node"
                  [ "$(lipo -archs "$APP/node/bin/node")" = "x86_64 arm64" ] || [ "$(lipo -archs "$APP/node/bin/node")" = "arm64 x86_64" ]
                  codesign --verify --strict --all-architectures "$APP/node/bin/node"
                  echo "Native: $("$APP/node/bin/node" -p 'process.arch + " " + process.version')"
                  if [ "$(uname -m)" = arm64 ] && arch -x86_64 /usr/bin/true 2> /dev/null; then
                      echo "With Rosetta: $(arch -x86_64 "$APP/node/bin/node" -p 'process.arch + " " + process.version')"
                  fi
                  root="$(NPM_CONFIG_PREFIX="$APP/app" "$APP/node/bin/npm" root -g)"
                  if [ "$root" != "$APP/app/lib/node_modules" ]; then
                      echo "npm root -g is $root: in-app updates would not find the install"
                      exit 1
                  fi
                  pkgutil --volume "$HOME" --pkg-info io.github.tannermidd.pi-pocket
                  # A command-line install must not start Pi Pocket: only a GUI install does.
                  sleep 10
                  if { pgrep -f "Pi Pocket.app/Contents/MacOS/Pi Pocket" || lsof -t "$APP/node/bin/node"; } > /dev/null 2>&1; then
                      echo "The command-line install started Pi Pocket"
                      exit 1
                  fi

            - name: Start Pi Pocket and check that it answers HTTP
              run: |
                  out="$RUNNER_TEMP/pi-pocket.log"
                  # Input from /dev/null, not a terminal: the launcher asks nothing and prints no key menu.
                  (cd "$HOME" && nohup "$APP/pi-pocket" --access local --yes --port 8787 < /dev/null > "$out" 2>&1 &)
                  code=000
                  for try in $(seq 1 180); do
                      sleep 1
                      code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/ || true)"
                      if [ "$code" != 000 ] && [ "$code" -lt 500 ]; then
                          break
                      fi
                  done
                  cat "$out"
                  echo "GET / answered $code after about $try seconds"
                  if [ "$code" != 200 ]; then
                      exit 1
                  fi
                  login="$(grep -oE 'http://127\.0\.0\.1:8787/[^[:space:]]+' "$out" | tail -1 || true)"
                  if [ -z "$login" ]; then
                      echo "The launcher printed no sign-in link"
                      exit 1
                  fi
                  # It signs in with a cookie, then sends the browser on to the app, which then answers for that cookie.
                  code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -c "$RUNNER_TEMP/cookies" "$login")"
                  echo "The sign-in link answered $code"
                  if [ "$code" != 303 ] || ! grep -q $'\tpocket_auth\t' "$RUNNER_TEMP/cookies"; then
                      echo "The sign-in link did not answer 303 with the pocket_auth cookie"
                      cat "$RUNNER_TEMP/cookies"
                      exit 1
                  fi
                  me="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -b "$RUNNER_TEMP/cookies" http://127.0.0.1:8787/api/me)"
                  anonymous="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8787/api/me)"
                  echo "/api/me answered $me with the cookie, and $anonymous without it"
                  if [ "$me" != 200 ] || [ "$anonymous" -lt 400 ]; then
                      exit 1
                  fi

            - name: Uninstall while Pi Pocket runs
              run: |
                  "$APP/uninstall.sh" --yes < /dev/null
                  for path in "$APP" "$BUNDLE" "$CONSOLE" "$AGENT"; do
                      if [ -e "$path" ]; then
                          echo "The uninstall left $path"
                          exit 1
                      fi
                  done
                  if pgrep -fl "Pi Pocket/node/bin/node"; then
                      echo "Pi Pocket still runs after the uninstall"
                      exit 1
                  fi
                  if curl -s -o /dev/null --max-time 5 http://127.0.0.1:8787/; then
                      echo "Port 8787 still answers after the uninstall"
                      exit 1
                  fi
                  if pkgutil --volume "$HOME" --pkgs | grep -F io.github.tannermidd.pi-pocket; then
                      echo "The uninstall left the package receipt"
                      exit 1
                  fi
                  if [ ! -d "$HOME/.pi-pocket" ]; then
                      echo "An uninstall without a terminal must keep the data folder"
                      exit 1
                  fi
                  echo "Uninstalled; the data folder stays."

            - name: Install again with the sign-in item
              run: |
                  cat > "$RUNNER_TEMP/choices.plist" <<'EOF'
                  <?xml version="1.0" encoding="UTF-8"?>
                  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
                  <plist version="1.0">
                  <array>
                      <dict>
                          <key>attributeSetting</key>
                          <integer>1</integer>
                          <key>choiceAttribute</key>
                          <string>selected</string>
                          <key>choiceIdentifier</key>
                          <string>login</string>
                      </dict>
                  </array>
                  </plist>
                  EOF
                  installer -pkg "$PKG" -target CurrentUserHomeDirectory -applyChoiceChangesXML "$RUNNER_TEMP/choices.plist"
                  plutil -lint "$AGENT"
                  plutil -p "$AGENT"
                  opens="$(plutil -extract ProgramArguments.3 raw "$AGENT")"
                  if [ "$opens" != "$BUNDLE" ] || [ "$(plutil -extract ProgramArguments.5 raw "$AGENT")" != --hidden ]; then
                      echo "The sign-in item opens $opens, not Pi Pocket.app with --hidden"
                      exit 1
                  fi

            - name: Open Pi Pocket.app
              run: |
                  open "$BUNDLE"
                  ready=""
                  for try in $(seq 1 180); do
                      sleep 1
                      if [ -f "$RUNNING" ] && [ "$(plutil -extract desktop raw "$RUNNING" 2> /dev/null)" = true ]; then
                          ready=yes
                          break
                      fi
                  done
                  cat "$LOG" || true
                  if [ -z "$ready" ]; then
                      echo "The app's launcher did not get ready in 180 seconds"
                      exit 1
                  fi
                  url="$(plutil -extract url raw "$RUNNING")"
                  echo "The app's launcher is ready at $url after about $try seconds"
                  if [ "$url" != http://127.0.0.1:8787 ]; then
                      echo "The app's server is at $url, not on this Mac only"
                      exit 1
                  fi
                  if pgrep -x Terminal; then
                      echo "Terminal runs: the app must not open it"
                      exit 1
                  fi
                  apps="$(pgrep -f "Pi Pocket.app/Contents/MacOS/Pi Pocket" | wc -l | tr -d ' ')"
                  if [ "$apps" != 1 ]; then
                      echo "$apps Pi Pocket.app processes run"
                      exit 1
                  fi
                  ps -axo pid,ppid,command | grep -F "Pi Pocket" | grep -v grep || true
                  # The window signs in by itself: the app writes the answer of its /api/me to the log.
                  for try in $(seq 1 60); do
                      if grep -q "The window is signed in." "$LOG"; then
                          break
                      fi
                      sleep 1
                  done
                  if ! grep -q "The window is signed in." "$LOG"; then
                      cat "$LOG"
                      echo "The window did not sign in"
                      exit 1
                  fi
                  token="$(plutil -extract ownerToken raw "$HOME/.pi-pocket/config.json")"
                  if grep -qF -e "$token" -e "/login" "$LOG"; then
                      echo "launcher.log has a sign-in link"
                      exit 1
                  fi
                  if ps -axww -o command | grep -F -e "$token" -e "once=" | grep -v grep; then
                      echo "A command line has the token or a sign-in link"
                      exit 1
                  fi
                  # The same sign-in flow over HTTP, as the app does it.
                  path="$(curl -sf --max-time 10 -X POST -H "Authorization: Bearer $token" -H "X-Pocket: 1" \
                      -H "Content-Type: application/json" -d '{}' "$url/api/sign-in-link" | plutil -extract path raw -)"
                  code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -c "$RUNNER_TEMP/app-cookies" "$url$path")"
                  me="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -b "$RUNNER_TEMP/app-cookies" "$url/api/me")"
                  again="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url$path")"
                  echo "The one-time link answered $code, then /api/me $me, and the link again $again"
                  [ "$code" = 303 ] && [ "$me" = 200 ] && [ "$again" = 401 ]

            - name: Take a screenshot of the window
              continue-on-error: true
              run: |
                  sleep 5
                  screencapture -x "$RUNNER_TEMP/macos-app-${{ matrix.arch }}.png"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              continue-on-error: true
              with:
                  name: macos-app-screenshot-${{ matrix.arch }}
                  path: ${{ runner.temp }}/macos-app-*.png
                  if-no-files-found: ignore
                  retention-days: 7

            - name: A second start opens the first one, and Quit stops it all
              run: |
                  # Run the executable itself, which LaunchServices would not: it must hand over and exit.
                  "$BUNDLE/Contents/MacOS/Pi Pocket" &
                  second=$!
                  for try in $(seq 1 20); do
                      if ! kill -0 "$second" 2> /dev/null; then
                          break
                      fi
                      sleep 1
                  done
                  if kill -0 "$second" 2> /dev/null; then
                      echo "A second Pi Pocket.app runs"
                      exit 1
                  fi
                  wait "$second"
                  [ "$(pgrep -f "Pi Pocket.app/Contents/MacOS/Pi Pocket" | wc -l | tr -d ' ')" = 1 ]
                  "$BUNDLE/Contents/MacOS/Pi Pocket" --quit
                  for try in $(seq 1 40); do
                      if ! { pgrep -f "Pi Pocket.app/Contents/MacOS/Pi Pocket" || lsof -t "$APP/node/bin/node"; } > /dev/null 2>&1; then
                          break
                      fi
                      sleep 1
                  done
                  cat "$LOG"
                  if { pgrep -f "Pi Pocket.app/Contents/MacOS/Pi Pocket" || lsof -t "$APP/node/bin/node"; } > /dev/null 2>&1; then
                      echo "Quit left Pi Pocket running"
                      exit 1
                  fi
                  if curl -s -o /dev/null --max-time 5 http://127.0.0.1:8787/; then
                      echo "Port 8787 still answers after Quit"
                      exit 1
                  fi
                  if [ -e "$RUNNING" ]; then
                      echo "Quit left launcher-running.json"
                      exit 1
                  fi

            - name: An older package makes the app show its error, and an install puts its own back
              run: |
                  cp "$MANIFEST" "$RUNNER_TEMP/package.json"
                  "$APP/node/bin/node" -e '
                      const fs = require("node:fs");
                      const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                      manifest.version = process.argv[2];
                      fs.writeFileSync(process.argv[1], JSON.stringify(manifest, null, 2));
                  ' "$MANIFEST" 0.0.1
                  open "$BUNDLE"
                  expected="The pi-pocket package of Pi Pocket is version 0.0.1, older than this app ($VERSION)."
                  for try in $(seq 1 60); do
                      if grep -qF "$expected" "$LOG"; then
                          break
                      fi
                      sleep 1
                  done
                  cat "$LOG"
                  if ! grep -qF "$expected" "$LOG"; then
                      echo "The app did not say that the package is older"
                      exit 1
                  fi
                  sleep 3
                  screencapture -x "$RUNNER_TEMP/macos-app-older-${{ matrix.arch }}.png" || true
                  app="$(pgrep -f "Pi Pocket.app/Contents/MacOS/Pi Pocket" || true)"
                  started="$(pgrep -f "Pi Pocket/app/lib/node_modules/pi-pocket" || true)"
                  pkill -9 -f "Pi Pocket.app/Contents/MacOS/Pi Pocket" || true
                  if [ -z "$app" ]; then
                      echo "The app exited without its alert"
                      exit 1
                  fi
                  if [ -n "$started" ]; then
                      echo "The app started the older package"
                      exit 1
                  fi
                  installer -pkg "$PKG" -target CurrentUserHomeDirectory
                  installed="$("$APP/node/bin/node" -p "require(process.argv[1]).version" "$MANIFEST")"
                  if [ "$installed" != "$VERSION" ]; then
                      echo "The install left pi-pocket $installed, not $VERSION"
                      exit 1
                  fi
                  echo "The install put pi-pocket $installed back"

            - name: An install keeps a newer package that the app updated to
              run: |
                  "$APP/node/bin/node" -e '
                      const fs = require("node:fs");
                      const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                      manifest.version = process.argv[2];
                      fs.writeFileSync(process.argv[1], JSON.stringify(manifest, null, 2));
                  ' "$MANIFEST" 99.0.0
                  installer -pkg "$PKG" -target CurrentUserHomeDirectory
                  cat "$APP/install.log"
                  installed="$("$APP/node/bin/node" -p "require(process.argv[1]).version" "$MANIFEST")"
                  if [ "$installed" != 99.0.0 ] || [ -e "$APP/app.new" ]; then
                      echo "The install replaced the newer pi-pocket with $installed, or left app.new"
                      exit 1
                  fi
                  grep -qF "pi-pocket 99.0.0 is newer than $VERSION: it stays." "$APP/install.log"
                  cp "$RUNNER_TEMP/package.json" "$MANIFEST"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              continue-on-error: true
              with:
                  name: macos-app-older-screenshot-${{ matrix.arch }}
                  path: ${{ runner.temp }}/macos-app-older-*.png
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Start the sign-in item and check that it answers HTTP
              run: |
                  launchctl bootstrap "gui/$(id -u)" "$AGENT"
                  code=000
                  for try in $(seq 1 180); do
                      sleep 1
                      code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/ || true)"
                      if [ "$code" != 000 ] && [ "$code" -lt 500 ]; then
                          break
                      fi
                  done
                  echo "GET / answered $code after about $try seconds"
                  if [ "$code" != 200 ]; then
                      launchctl print "gui/$(id -u)/io.github.tannermidd.pi-pocket" || true
                      cat "$HOME/Library/Logs/Pi Pocket/sign-in-item.log" "$LOG" || true
                      ps -axo pid,ppid,command | grep -F "Pi Pocket" | grep -v grep || true
                      exit 1
                  fi
                  pgrep -fl "Pi Pocket.app/Contents/MacOS/Pi Pocket"
                  if pgrep -x Terminal; then
                      echo "Terminal runs: the sign-in item must not open it"
                      exit 1
                  fi

            - name: Install over the running Pi Pocket, which keeps the sign-in item
              run: |
                  installer -pkg "$PKG" -target CurrentUserHomeDirectory
                  if pgrep -fl "Pi Pocket/node/bin/node" || pgrep -fl "Pi Pocket.app/Contents/MacOS/Pi Pocket"; then
                      echo "Pi Pocket still runs after the install over it"
                      exit 1
                  fi
                  if [ ! -e "$AGENT" ]; then
                      echo "The install over an earlier one turned the sign-in item off"
                      exit 1
                  fi
                  [ -x "$BUNDLE/Contents/MacOS/Pi Pocket" ]
                  [ -f "$APP/app/lib/node_modules/pi-pocket/bin/pi-pocket.js" ]
                  [ "$("$APP/node/bin/node" -p "require(process.argv[1]).version" "$MANIFEST")" = "$VERSION" ]

            - name: Uninstall with the data
              run: |
                  "$APP/uninstall.sh" --yes --delete-data < /dev/null
                  for path in "$APP" "$BUNDLE" "$CONSOLE" "$AGENT" "$HOME/.pi-pocket"; do
                      if [ -e "$path" ]; then
                          echo "The uninstall left $path"
                          exit 1
                      fi
                  done

            - name: Show the logs
              if: failure()
              run: |
                  cat "$APP/install.log" "$RUNNER_TEMP/pi-pocket.log" "$LOG" 2> /dev/null || true
                  grep -E "installd|package_script_service|installer\[" /var/log/install.log | tail -150 || true

    checks:
        name: Type check and tests
        runs-on: macos-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - run: npm run check

            # The tests that do not pass on macOS yet are skipped by name, and pip-board-ui.test.ts as a whole (docs/macos.md
            # says why): tests that press Ctrl and Alt where the app takes ⌘ and Option on a Mac, time limits and
            # animations that the slower runner misses, and some browser tests not yet looked into. The last 4 passed in
            # one run and failed in the next: they are flaky on the runner.
            - name: Tests
              timeout-minutes: 30
              # The browser tests time out at random on the macOS runner (a different 4 in each run), so they are left
              # out here, as on Windows: a browser path that does not exist makes each one skip itself.
              env:
                  PI_POCKET_BROWSER: /nonexistent/no-browser-on-macos-ci
              run: >
                  node --test --test-concurrency=4 --test-timeout=300000
                  --test-skip-pattern="a taken app key opens neither a sheet nor the launcher"
                  --test-skip-pattern="open resets query and focus"
                  --test-skip-pattern="New session opens the folder sheet and its final focus"
                  --test-skip-pattern="Peeks finds the action by its feature name"
                  --test-skip-pattern="a favorite folder shows while the launcher is open"
                  --test-skip-pattern="New session here starts in the open session's folder"
                  --test-skip-pattern="a paste inside a quote, short or long, goes under it"
                  --test-skip-pattern="a large page with many findings is fixed in time"
                  --test-skip-pattern="an unterminated <item> list parses in linear time"
                  --test-skip-pattern="25 pages in other styles give only the findings"
                  --test-skip-pattern="helpers past the soft limit cost the parent one message"
                  --test-skip-pattern="the hard limit stops the stuck call"
                  --test-skip-pattern="a late catch-up glides"
                  --test-skip-pattern="a catch-up taller than the screen glides"
                  --test-skip-pattern="a reconnect, and a reload of a cached session, glide"
                  --test-skip-pattern="what came while away slides in"
                  --test-skip-pattern="drafts stay with their person across a switch"
                  --test-skip-pattern="a starting tab keeps its answer for the same person only"
                  --test-skip-pattern="on a phone the view is one column that fits"
                  --test-skip-pattern="device sizes change the frame, and fit scales it"
                  --test-skip-pattern="on a phone the panel covers the chat, and the canvas"
                  --test-skip-pattern="pointing at an element makes a comment that everyone sees"
                  --test-skip-pattern="tweaks from the page's manifest show as controls"
                  --test-skip-pattern="a deck has a slide strip, and present mode"
                  --test-skip-pattern="Markdown extension points render, update, and remove"
                  --test-skip-pattern="a linked session's message is a card that names its session"
