# Runs the whole test suite on Linux with a real Chromium, for each pull request. It publishes nothing.
# The browser tests (test/*-ui.test.ts, browser.test.ts, and others) skip themselves when findBrowser() finds no browser.
# The macOS and Windows jobs leave them out on purpose (their comments say why), so this is the job that runs them. It
# fails when the runner has no browser, and when a test skips itself for lack of one, so a pull request cannot pass
# with the browser tests unrun.
name: Linux

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: linux-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Type check and tests (with Chromium)
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - run: npm run check

            # The tests find the browser as Pi Pocket does. The runner has Google Chrome; this fails at once if it does
            # not, or if the browser cannot start, instead of letting every browser test skip.
            - name: Find the browser, and check that it starts
              run: |
                  browser="$(node --input-type=module -e 'import { findBrowser } from "./src/server/browser/discovery.ts"; console.log(findBrowser() ?? "")')"
                  if [ -z "$browser" ]; then
                      echo "::error::findBrowser() found no browser on the runner: the browser tests would skip"
                      exit 1
                  fi
                  echo "Browser: $browser"
                  "$browser" --version
                  "$browser" --headless=new --disable-gpu --dump-dom about:blank

            - name: Tests
              timeout-minutes: 50
              run: |
                  set -o pipefail
                  node --test --test-concurrency=4 --test-timeout=600000 --test-reporter=spec test/*.test.ts 2>&1 | tee "$RUNNER_TEMP/tests.log"

            # A skip that names a browser means a test did not run for lack of one.
            - name: No browser test skipped
              if: always()
              run: |
                  [ -f "$RUNNER_TEMP/tests.log" ] || exit 0
                  grep -E '^\s*﹣' "$RUNNER_TEMP/tests.log" | sed -E 's/\([0-9.]+ms\)//' | sort | uniq -c | sort -rn | head -40 || true
                  if grep -E '^\s*﹣.*(chrom|browser)' -i "$RUNNER_TEMP/tests.log"; then
                      echo "::error::Browser tests skipped themselves, though the runner has a browser"
                      exit 1
                  fi
