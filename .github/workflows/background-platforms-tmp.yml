# TEMPORARY: runs the background task tests on macOS and Windows for each push to this branch. Remove before merge.
name: Background tasks (temporary)

on:
    push:
        branches: [feat/background-crossplatform]

permissions:
    contents: read

jobs:
    tests:
        name: Background tests (${{ matrix.runner }})
        strategy:
            fail-fast: false
            matrix:
                runner: [macos-latest, macos-15-intel, windows-latest]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - name: Background and quiet-limit tests
              run: node --test --test-concurrency=1 --test-timeout=180000 test/background-platforms.test.ts test/deadlines.test.ts
