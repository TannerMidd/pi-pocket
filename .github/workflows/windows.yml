# Checks Pi Pocket on Windows for each pull request. It publishes nothing.
# - installer: builds the installer (packaging/windows) with the package of this checkout in it, then blocks npm, as a
#   company network can: Setup and Pi Pocket must work without it. It installs silently, starts the console launcher
#   without its menu, checks that it answers HTTP and that the sign-in link works, and stops it. Then it opens the
#   desktop app (Pi Pocket.exe) as the Start menu does: no console window, a server on this PC only, an Edge app window
#   that signed in with a one-time link, one instance only, and Quit that stops it all. An older package makes the app
#   show its error and start nothing, and Setup puts its own package back; a newer one stays. It uninstalls while the
#   app runs, which must stop it and keep the data folder.
# - update: starts the installed desktop app and stages a synthetic npm release from a loopback HTTPS registry.
#   The new server must report success and read the same saved session and setting.
# - checks: the type check and the part of the test suite that is known to pass on Windows, with the background task
#   and quiet-limit tests.
name: Windows

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: windows-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    installer:
        name: Installer (install, start, uninstall)
        runs-on: windows-latest
        timeout-minutes: 40
        defaults:
            run:
                shell: pwsh
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26

            - name: Read the version
              run: |
                  $version = node -p "require('./package.json').version"
                  "VERSION=$version" >> $env:GITHUB_ENV
                  "APP=$(Join-Path $env:LOCALAPPDATA 'Pi Pocket')" >> $env:GITHUB_ENV
                  "SETUP=$(Join-Path $env:RUNNER_TEMP "setup\Pi-Pocket-Setup-$version.exe")" >> $env:GITHUB_ENV
                  "MANIFEST=$(Join-Path $env:LOCALAPPDATA 'Pi Pocket\app\node_modules\pi-pocket\package.json')" >> $env:GITHUB_ENV

            - name: Build the installer
              run: |
                  ./packaging/windows/build.ps1 -Version $env:VERSION -OutDir (Join-Path $env:RUNNER_TEMP "setup")
                  Write-Host "Setup is $([math]::Round((Get-Item $env:SETUP).Length / 1MB, 1)) MB"

            # From here on, nothing reaches npm's registry: its names point to this PC, where nothing listens, and npm
            # gets an address that refuses.
            - name: Block npm, as a company network can
              run: |
                  $hosts = Join-Path $env:WINDIR "System32\drivers\etc\hosts"
                  Add-Content -Path $hosts -Value "`r`n127.0.0.1 registry.npmjs.org`r`n127.0.0.1 registry.npmjs.com`r`n::1 registry.npmjs.org`r`n::1 registry.npmjs.com`r`n"
                  ipconfig /flushdns | Out-Null
                  "NPM_CONFIG_REGISTRY=http://127.0.0.1:9/" >> $env:GITHUB_ENV
                  $env:NPM_CONFIG_REGISTRY = "http://127.0.0.1:9/"
                  npm view pi-pocket version --fetch-retries=0 --prefer-online
                  if ($LASTEXITCODE -eq 0) { throw "npm still reaches a registry" }
                  $reached = $false
                  try {
                      Invoke-WebRequest -Uri "https://registry.npmjs.org/pi-pocket" -UseBasicParsing -TimeoutSec 10 | Out-Null
                      $reached = $true
                  } catch {
                      Write-Host "registry.npmjs.org is blocked: $($_.Exception.Message)"
                  }
                  if ($reached) { throw "registry.npmjs.org still answers" }
                  # npm's failure above is the expected one: it must not be the step's exit code.
                  exit 0

            - name: Install silently
              run: |
                  $log = Join-Path $env:RUNNER_TEMP "setup.log"
                  $run = Start-Process -FilePath $env:SETUP -Wait -PassThru -ArgumentList @(
                      "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$log"
                  )
                  if ($run.ExitCode -ne 0) {
                      Get-Content $log
                      throw "Setup exited with $($run.ExitCode)"
                  }
                  $expected = @(
                      "node\node.exe",
                      "node\npm.cmd",
                      "pi-pocket.cmd",
                      "Pi Pocket.exe",
                      "app\node_modules\pi-pocket\bin\pi-pocket.js",
                      "app\setup-finished.txt",
                      "unins000.exe"
                  )
                  foreach ($file in $expected) {
                      if (-not (Test-Path (Join-Path $env:APP $file))) { throw "Setup did not install $file" }
                  }
                  $installed = (Get-Content -Raw $env:MANIFEST | ConvertFrom-Json).version
                  if ($installed -ne $env:VERSION) { throw "Setup installed pi-pocket $installed, not $env:VERSION" }
                  if (Test-Path (Join-Path $env:APP "install-app.mjs")) { throw "Setup installed install-app.mjs" }
                  $count = @(Get-ChildItem -Recurse -File (Join-Path $env:APP "app")).Count
                  Write-Host "Setup installed pi-pocket $installed, with $count files in app\"
                  $shell = New-Object -ComObject WScript.Shell
                  $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
                  foreach ($each in @(@("Pi Pocket.lnk", "Pi Pocket.exe"), @("Pi Pocket (console).lnk", "pi-pocket.cmd"))) {
                      $shortcut = Join-Path $menu $each[0]
                      if (-not (Test-Path $shortcut)) { throw "No Start menu shortcut at $shortcut" }
                      $target = $shell.CreateShortcut($shortcut).TargetPath
                      if ($target -ne (Join-Path $env:APP $each[1])) { throw "$($each[0]) opens $target" }
                  }
                  (Get-Item (Join-Path $env:APP "Pi Pocket.exe")).VersionInfo | Format-List FileDescription, ProductVersion, FileVersion
                  $startup = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Startup\Pi Pocket.lnk"
                  if (Test-Path $startup) { throw "The sign-in shortcut is there, but its task is off by default" }
                  & (Join-Path $env:APP "node\node.exe") --version

            - name: Start Pi Pocket and check that it answers HTTP
              run: |
                  $out = Join-Path $env:RUNNER_TEMP "pi-pocket.out.log"
                  $err = Join-Path $env:RUNNER_TEMP "pi-pocket.err.log"
                  $empty = Join-Path $env:RUNNER_TEMP "empty.txt"
                  New-Item -ItemType File -Force $empty | Out-Null
                  # Input from a file, not a terminal: the launcher asks nothing and prints no key menu.
                  Start-Process -FilePath (Join-Path $env:APP "pi-pocket.cmd") -WorkingDirectory $env:RUNNER_TEMP `
                      -ArgumentList @("--access", "local", "--yes", "--port", "8787") `
                      -RedirectStandardInput $empty -RedirectStandardOutput $out -RedirectStandardError $err
                  # The server answers 503 while it starts, then 200.
                  $answer = $null
                  for ($try = 0; $try -lt 180 -and ($null -eq $answer -or $answer.StatusCode -ge 500); $try++) {
                      Start-Sleep -Seconds 1
                      try {
                          $answer = Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
                      } catch {}
                  }
                  Get-Content $out, $err -ErrorAction SilentlyContinue
                  if ($null -eq $answer) { throw "Pi Pocket did not answer on http://127.0.0.1:8787/ in 180 seconds" }
                  Write-Host "GET / answered $($answer.StatusCode) after about $try seconds"
                  if ($answer.StatusCode -ge 500) { throw "GET / still answers $($answer.StatusCode) after 180 seconds" }
                  $login = Select-String -Path $out -Pattern 'http://127\.0\.0\.1:8787/\S*' -AllMatches |
                      ForEach-Object { $_.Matches.Value } | Where-Object { $_ -ne "http://127.0.0.1:8787" } | Select-Object -Last 1
                  if ($null -eq $login) { throw "The launcher printed no sign-in link" }
                  # It signs in, then sends the browser on to the app.
                  $session = Invoke-WebRequest -Uri $login -UseBasicParsing -TimeoutSec 10 -SkipHttpErrorCheck -SessionVariable cookies
                  Write-Host "The sign-in link answered $($session.StatusCode), with $($cookies.Cookies.Count) cookies"
                  if ($session.StatusCode -ge 400) { throw "The sign-in link answered $($session.StatusCode)" }

            - name: Stop the console launcher
              run: |
                  $console = @(Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:APP\*" })
                  foreach ($each in $console) { & taskkill.exe /F /T /PID $each.Id 2>&1 | Out-Null }
                  for ($try = 0; $try -lt 30; $try++) {
                      try { Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -UseBasicParsing -TimeoutSec 2 | Out-Null } catch { break }
                      Start-Sleep -Seconds 1
                  }
                  Remove-Item -Force (Join-Path $env:USERPROFILE ".pi-pocket\launcher-running.json") -ErrorAction SilentlyContinue

            - name: Open the desktop app as the Start menu does
              run: |
                  $data = Join-Path $env:USERPROFILE ".pi-pocket"
                  $running = Join-Path $data "launcher-running.json"
                  $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Pi Pocket.lnk"
                  Start-Process -FilePath $shortcut
                  $info = $null
                  for ($try = 0; $try -lt 180 -and $null -eq $info; $try++) {
                      Start-Sleep -Seconds 1
                      if (Test-Path $running) {
                          $candidate = Get-Content -Raw $running | ConvertFrom-Json
                          if ($candidate.desktop) { $info = $candidate }
                      }
                  }
                  Get-Content (Join-Path $env:APP "launcher.log") -ErrorAction SilentlyContinue
                  if ($null -eq $info) { throw "The app's launcher did not get ready in 180 seconds" }
                  Write-Host "The app's launcher is ready at $($info.url) after about $try seconds"
                  if ($info.url -ne "http://127.0.0.1:8787") { throw "The app's server is at $($info.url), not on this PC only" }
                  $app = @(Get-Process -Name "Pi Pocket" -ErrorAction SilentlyContinue)
                  if ($app.Count -ne 1) { throw "$($app.Count) Pi Pocket.exe processes run" }
                  $nodes = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.ExecutablePath -like "$env:APP\*" })
                  $nodes | Format-Table ProcessId, ParentProcessId, CommandLine -AutoSize -Wrap
                  if ($nodes.Count -lt 2) { throw "The launcher and the server do not both run" }
                  foreach ($node in $nodes) {
                      if ((Get-Process -Id $node.ProcessId).MainWindowHandle -ne 0) { throw "node.exe $($node.ProcessId) has a window" }
                  }
                  $consoles = @(Get-CimInstance Win32_Process -Filter "Name = 'conhost.exe' OR Name = 'WindowsTerminal.exe' OR Name = 'OpenConsole.exe'" |
                      Where-Object { $nodes.ProcessId -contains $_.ParentProcessId } |
                      Where-Object { (Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue).MainWindowHandle -ne 0 })
                  if ($consoles.Count -gt 0) { throw "A console window shows for Pi Pocket" }
                  # The window: Edge in app mode, with its own profile, signed in with a one-time link and no token.
                  $token = (Get-Content -Raw (Join-Path $data "config.json") | ConvertFrom-Json).ownerToken
                  $edge = $null
                  for ($try = 0; $try -lt 60 -and $null -eq $edge; $try++) {
                      Start-Sleep -Seconds 1
                      $edge = Get-CimInstance Win32_Process -Filter "Name = 'msedge.exe'" |
                          Where-Object { $_.CommandLine -like "*--app=*" -and $_.CommandLine -like "*Pi Pocket\Edge profile*" } |
                          Select-Object -First 1
                  }
                  if ($null -eq $edge) { throw "The app opened no Edge app window" }
                  $line = $edge.CommandLine
                  if ($line.Contains($token)) { throw "The owner token is on Edge's command line" }
                  if ($line -notmatch '--app=(http://127\.0\.0\.1:8787/login\?once=[A-Za-z0-9_-]+)') { throw "Edge opened no one-time sign-in link" }
                  $link = $Matches[1]
                  # Edge spent the link: it opened it and got the sign-in cookie. A request before Edge's would spend it
                  # itself, so it waits for Edge's page to render first.
                  for ($try = 0; $try -lt 60; $try++) {
                      $renderers = @(Get-CimInstance Win32_Process -Filter "Name = 'msedge.exe'" |
                          Where-Object { $_.CommandLine -like "*--type=renderer*" -and $_.CommandLine -like "*Pi Pocket\Edge profile*" })
                      if ($renderers.Count -gt 0) { break }
                      Start-Sleep -Seconds 1
                  }
                  Start-Sleep -Seconds 10
                  $spent = Invoke-WebRequest -Uri $link -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck -MaximumRedirection 0
                  Write-Host "The window's one-time link answers $($spent.StatusCode) now"
                  if ($spent.StatusCode -ne 401) { throw "Edge did not open the one-time sign-in link" }
                  # The same sign-in flow over HTTP, as the app does it.
                  $headers = @{ Authorization = "Bearer $token"; "X-Pocket" = "1" }
                  $path = (Invoke-RestMethod -Method Post -Uri "$($info.url)/api/sign-in-link" -Headers $headers -Body "{}" -ContentType "application/json").path
                  # It answers 303 with the cookie, on to the app.
                  $signed = Invoke-WebRequest -Uri "$($info.url)$path" -UseBasicParsing -SkipHttpErrorCheck -SessionVariable cookies
                  if ($signed.StatusCode -ne 200 -or $cookies.Cookies.GetCookies($info.url)["pocket_auth"] -eq $null) {
                      throw "The one-time link answered $($signed.StatusCode), without the pocket_auth cookie"
                  }
                  $me = Invoke-WebRequest -Uri "$($info.url)/api/me" -UseBasicParsing -SkipHttpErrorCheck -WebSession $cookies
                  if ($me.StatusCode -ne 200) { throw "/api/me answered $($me.StatusCode) after the one-time sign-in" }
                  $log = Get-Content -Raw (Join-Path $env:APP "launcher.log")
                  if ($log.Contains($token) -or $log.Contains("/login")) { throw "launcher.log has a sign-in link" }
                  "EDGE_PID=$($edge.ProcessId)" >> $env:GITHUB_ENV

            - name: Take a screenshot of the window
              continue-on-error: true
              run: |
                  Start-Sleep -Seconds 5
                  Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                  $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                  $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
                  $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                  $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
                  $bitmap.Save((Join-Path $env:RUNNER_TEMP "windows-app.png"), [System.Drawing.Imaging.ImageFormat]::Png)

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              continue-on-error: true
              with:
                  name: windows-app-screenshot
                  path: ${{ runner.temp }}/windows-app.png
                  if-no-files-found: ignore
                  retention-days: 7

            - name: A second start opens the first one, and Quit stops it all
              run: |
                  $second = Start-Process -FilePath (Join-Path $env:APP "Pi Pocket.exe") -PassThru -Wait
                  if ($second.ExitCode -ne 0) { throw "The second start exited with $($second.ExitCode)" }
                  if (@(Get-Process -Name "Pi Pocket").Count -ne 1) { throw "A second app runs" }
                  $quit = Start-Process -FilePath (Join-Path $env:APP "Pi Pocket.exe") -ArgumentList "--quit" -PassThru -Wait
                  if ($quit.ExitCode -ne 0) { throw "--quit exited with $($quit.ExitCode)" }
                  for ($try = 0; $try -lt 40 -and @(Get-Process -Name "Pi Pocket" -ErrorAction SilentlyContinue).Count -gt 0; $try++) {
                      Start-Sleep -Seconds 1
                  }
                  if (@(Get-Process -Name "Pi Pocket" -ErrorAction SilentlyContinue).Count -gt 0) { throw "The app did not quit" }
                  Start-Sleep -Seconds 2
                  $left = @(Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:APP\*" })
                  if ($left.Count -gt 0) { throw "Quit left $($left.Count) node.exe processes" }
                  if (Get-Process -Id $env:EDGE_PID -ErrorAction SilentlyContinue) { throw "Quit left the Edge window" }
                  if (Test-Path (Join-Path $env:USERPROFILE ".pi-pocket\launcher-running.json")) { throw "Quit left launcher-running.json" }
                  try {
                      Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -UseBasicParsing -TimeoutSec 5 | Out-Null
                      throw "Port 8787 still answers after Quit"
                  } catch [System.Net.Http.HttpRequestException] {}
                  Get-Content (Join-Path $env:APP "launcher.log")

            - name: An older package makes the app show its error, and Setup puts its own back
              run: |
                  $text = Get-Content -Raw $env:MANIFEST
                  $older = $text -replace ('"version":\s*"' + [regex]::Escape($env:VERSION) + '"'), '"version": "0.0.1"'
                  if ($older -eq $text) { throw "No version $env:VERSION in $env:MANIFEST" }
                  [IO.File]::WriteAllText($env:MANIFEST, $older)
                  $app = Start-Process -FilePath (Join-Path $env:APP "Pi Pocket.exe") -PassThru
                  $log = Join-Path $env:APP "launcher.log"
                  $expected = "The pi-pocket package of Pi Pocket is version 0.0.1, older than this app ($env:VERSION)."
                  $said = $false
                  for ($try = 0; $try -lt 60 -and -not $said; $try++) {
                      Start-Sleep -Seconds 1
                      $said = (Test-Path $log) -and (Select-String -Path $log -SimpleMatch $expected -Quiet)
                  }
                  Get-Content $log -ErrorAction SilentlyContinue
                  if (-not $said) { throw "The app did not say that the package is older" }
                  $app.Refresh()
                  for ($try = 0; $try -lt 20 -and -not $app.HasExited -and $app.MainWindowHandle -eq 0; $try++) {
                      Start-Sleep -Milliseconds 500
                      $app.Refresh()
                  }
                  if ($app.HasExited) { throw "The app exited without its message window" }
                  Write-Host "The app shows the window '$($app.MainWindowTitle)'"
                  if ($app.MainWindowHandle -eq 0 -or $app.MainWindowTitle -ne "Pi Pocket") { throw "The app shows no message window" }
                  try {
                      Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                      $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                      $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
                      [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
                      $bitmap.Save((Join-Path $env:RUNNER_TEMP "windows-app-older.png"), [System.Drawing.Imaging.ImageFormat]::Png)
                  } catch {
                      Write-Host "No screenshot: $($_.Exception.Message)"
                  }
                  $nodes = @(Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:APP\*" })
                  Stop-Process -Id $app.Id -Force
                  if ($nodes.Count -gt 0) { throw "The app started the older package" }
                  $run = Start-Process -FilePath $env:SETUP -Wait -PassThru -ArgumentList @(
                      "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$(Join-Path $env:RUNNER_TEMP 'setup-again.log')"
                  )
                  if ($run.ExitCode -ne 0) { throw "Setup exited with $($run.ExitCode)" }
                  $installed = (Get-Content -Raw $env:MANIFEST | ConvertFrom-Json).version
                  if ($installed -ne $env:VERSION) { throw "Setup left pi-pocket $installed, not $env:VERSION" }
                  Write-Host "Setup put pi-pocket $installed back"

            - name: Setup keeps a newer package that the app updated to
              run: |
                  $text = Get-Content -Raw $env:MANIFEST
                  [IO.File]::WriteAllText($env:MANIFEST, ($text -replace ('"version":\s*"' + [regex]::Escape($env:VERSION) + '"'), '"version": "99.0.0"'))
                  $log = Join-Path $env:RUNNER_TEMP "setup-newer.log"
                  $run = Start-Process -FilePath $env:SETUP -Wait -PassThru -ArgumentList @(
                      "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$log"
                  )
                  if ($run.ExitCode -ne 0) { throw "Setup exited with $($run.ExitCode)" }
                  Select-String -Path $log -SimpleMatch "pi-pocket"
                  $installed = (Get-Content -Raw $env:MANIFEST | ConvertFrom-Json).version
                  if ($installed -ne "99.0.0") { throw "Setup replaced the newer pi-pocket with $installed" }
                  if (-not (Select-String -Path $log -SimpleMatch "pi-pocket 99.0.0 is newer than $env:VERSION" -Quiet)) {
                      throw "Setup's log does not say that the newer package stays"
                  }
                  [IO.File]::WriteAllText($env:MANIFEST, $text)

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              continue-on-error: true
              with:
                  name: windows-app-older-screenshot
                  path: ${{ runner.temp }}/windows-app-older.png
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Start the app without a window, as the sign-in shortcut does
              run: |
                  Start-Process -FilePath (Join-Path $env:APP "Pi Pocket.exe") -ArgumentList "--hidden"
                  $answer = $null
                  for ($try = 0; $try -lt 180 -and $null -eq $answer; $try++) {
                      Start-Sleep -Seconds 1
                      try { $answer = Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -UseBasicParsing -TimeoutSec 5 } catch {}
                  }
                  if ($null -eq $answer) { throw "The hidden app's server did not answer" }
                  $edge = @(Get-CimInstance Win32_Process -Filter "Name = 'msedge.exe'" | Where-Object { $_.CommandLine -like "*Pi Pocket\Edge profile*" })
                  if ($edge.Count -gt 0) { throw "--hidden opened a window" }

            - name: Uninstall silently while Pi Pocket runs
              run: |
                  $uninstallLog = Join-Path $env:RUNNER_TEMP "uninstall.log"
                  $run = Start-Process -FilePath (Join-Path $env:APP "unins000.exe") -Wait -PassThru -ArgumentList @(
                      "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$uninstallLog"
                  )
                  if ($run.ExitCode -ne 0) { throw "The uninstaller exited with $($run.ExitCode)" }
                  # The uninstaller runs a copy of itself from the temp folder, which may still be at work.
                  for ($try = 0; $try -lt 60 -and (Test-Path $env:APP); $try++) { Start-Sleep -Seconds 1 }
                  if (Test-Path $env:APP) {
                      Get-Content $uninstallLog -ErrorAction SilentlyContinue
                      Get-ChildItem -Force -Recurse $env:APP | Select-Object -First 50 FullName
                      Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*Pi Pocket*" } |
                          Format-Table ProcessId, Name, CommandLine -AutoSize -Wrap
                      throw "The uninstaller left $env:APP"
                  }
                  $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Pi Pocket.lnk"
                  if (Test-Path $shortcut) { throw "The uninstaller left the Start menu shortcut" }
                  $left = @(Get-Process -Name node, "Pi Pocket" -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:APP\*" })
                  if ($left.Count -gt 0) { throw "Pi Pocket still runs after the uninstall" }
                  try {
                      Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -UseBasicParsing -TimeoutSec 5 | Out-Null
                      throw "Port 8787 still answers after the uninstall"
                  } catch [System.Net.Http.HttpRequestException] {}
                  $data = Join-Path $env:USERPROFILE ".pi-pocket"
                  if (-not (Test-Path $data)) { throw "A silent uninstall must keep the data folder $data" }
                  Write-Host "Uninstalled; the data folder $data stays."

            - name: Show the logs
              if: failure()
              run: |
                  Get-Content (Join-Path $env:RUNNER_TEMP "setup.log") -ErrorAction SilentlyContinue
                  Get-ChildItem $env:TEMP -Filter "Setup Log*.txt" -ErrorAction SilentlyContinue | Get-Content
                  Get-Content (Join-Path $env:RUNNER_TEMP "pi-pocket.out.log"), (Join-Path $env:RUNNER_TEMP "pi-pocket.err.log") -ErrorAction SilentlyContinue
                  Get-Content (Join-Path $env:APP "launcher.log") -ErrorAction SilentlyContinue

    update:
        name: Installed update (the desktop app updates itself)
        runs-on: windows-latest
        timeout-minutes: 45
        defaults:
            run:
                shell: pwsh
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26

            - name: Build and install this checkout
              run: |
                  $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
                  $setup = Join-Path $env:RUNNER_TEMP setup
                  ./packaging/windows/build.ps1 -Version $version -OutDir $setup
                  $run = Start-Process "$setup\Pi-Pocket-Setup-$version.exe" '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
                  if ($run.ExitCode -ne 0) { throw "Setup exited with $($run.ExitCode)" }
                  "VERSION=$version" >> $env:GITHUB_ENV
                  "APP=$env:LOCALAPPDATA\Pi Pocket" >> $env:GITHUB_ENV
                  "FIXTURE=$env:RUNNER_TEMP\update-registry" >> $env:GITHUB_ENV

            - name: Pack the installed dependency tree as a newer version
              run: |
                  $env:OPENSSL = @(
                      (Get-Command openssl.exe -ErrorAction SilentlyContinue).Source
                      "$env:ProgramFiles\Git\usr\bin\openssl.exe"
                      "$env:ProgramFiles\Git\mingw64\bin\openssl.exe"
                  ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
                  if (!$env:OPENSSL) { throw 'OpenSSL was not found' }
                  & "$env:APP\node\node.exe" packaging/windows/update-fixture.mjs prepare $env:FIXTURE "$env:APP\app\node_modules\pi-pocket"

            - name: Serve that version on loopback with a private test CA
              run: |
                  $hostsFile = Join-Path $env:WINDIR 'System32\drivers\etc\hosts'
                  Add-Content $hostsFile ([Environment]::NewLine + "127.0.0.1 registry.npmjs.org" + [Environment]::NewLine + "::1 registry.npmjs.org")
                  ipconfig /flushdns | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw "DNS flush failed" }
                  $serve = Start-Process node -ArgumentList ('"{0}\packaging\windows\update-fixture.mjs" serve "{1}"' -f $PWD,$env:FIXTURE) -PassThru
                  $ready = Join-Path $env:FIXTURE ready
                  for ($i = 0; $i -lt 30 -and !(Test-Path $ready); $i++) {
                      if ($serve.HasExited) { throw "Fixture exited with $($serve.ExitCode)" }
                      Start-Sleep -Seconds 1
                  }
                  "SYNTHETIC=$(Get-Content -Raw $ready)" >> $env:GITHUB_ENV
                  "NODE_EXTRA_CA_CERTS=$env:FIXTURE\ca.pem" >> $env:GITHUB_ENV

            - name: Update through the running desktop app
              id: desktop
              run: |
                  $data = Join-Path $env:USERPROFILE .pi-pocket
                  $base = 'http://127.0.0.1:8787'
                  $desktop = Start-Process "$env:APP\Pi Pocket.exe" -PassThru
                  # The ready file precedes the asynchronous launch of the Edge app window.
                  $edge = $null
                  for ($i = 0; $i -lt 180 -and !$edge; $i++) {
                      if ($desktop.HasExited) { throw 'Desktop exited before readiness' }
                      Start-Sleep -Seconds 1
                      $edge = Get-CimInstance Win32_Process -Filter "Name = 'msedge.exe'" | Where-Object {
                          $_.CommandLine -like '*--app=*' -and $_.CommandLine -like '*Pi Pocket\Edge profile*'
                      } | Select-Object -First 1
                  }
                  $running = Get-Content -Raw "$data\launcher-running.json" | ConvertFrom-Json
                  if (!$edge -or !$running.desktop -or $running.url -ne $base) { throw 'Desktop is not ready' }
                  try { $token = (Get-Content -Raw "$data\config.json" | ConvertFrom-Json).ownerToken } catch { throw 'Unreadable owner config' }
                  $headers = @{ Authorization = "Bearer $token"; 'X-Pocket' = '1' }
                  function Api($path, $body, $timeout = 30) {
                      $options = @{ Uri = "$base/api/$path"; Headers = $headers; TimeoutSec = $timeout; SkipHttpErrorCheck = $true }
                      if ($null -ne $body) {
                          $options += @{ Method = 'Post'; ContentType = 'application/json'; Body = ($body | ConvertTo-Json -Compress) }
                      }
                      try { $reply = Invoke-WebRequest @options } catch {
                          if ($path -eq 'x/updates/status') { return $null } # Connection refused during restart.
                          throw "$path connection failed"
                      }
                      if ($path -eq 'x/updates/status' -and $reply.StatusCode -eq 503) { return $null } # Server starting.
                      if ($reply.StatusCode -ne 200) {
                          # Never emit API error text, launcher logs, command lines or a sign-in URL.
                          $reason = [regex]::Match($reply.Content, '\b(EPERM|EBUSY|EACCES|ENOENT)\b').Value
                          $swap = $reply.Content -match 'rename' -and $reply.Content -match 'previous'
                          throw "$path HTTP $([int]$reply.StatusCode); code=$reason; renameToPrevious=$swap"
                      }
                      try { return ($reply.Content | ConvertFrom-Json) } catch { throw "$path sent invalid JSON" }
                  }
                  function ServerPid {
                      (Get-NetTCPConnection -State Listen -LocalAddress 127.0.0.1 -LocalPort 8787).OwningProcess
                  }

                  $before = ServerPid
                  $title = 'Installed update persistence check'
                  $session = Api sessions @{ title = $title }
                  $null = Api settings @{ limitWaitHours = 12 }
                  $checked = Api x/updates/check @{} 120
                  if ($checked.version -ne $env:VERSION -or $checked.installKind -ne 'npm-global' -or
                      !$checked.available -or $checked.latest.version -ne $env:SYNTHETIC -or $checked.blockers.Count) {
                      throw 'Update check did not offer the fixture release for this install'
                  }
                  Write-Host 'Checked the fixture version. Applying through the production updater.'
                  $applied = Api x/updates/apply @{ confirmWarning = $true } 1500
                  if (!$applied.restarting -or $applied.version -ne $env:SYNTHETIC) { throw 'Apply did not request restart' }

                  $deadline = (Get-Date).AddMinutes(3)
                  do {
                      Start-Sleep -Seconds 1
                      $status = Api x/updates/status $null 5
                      if ($status.version -eq $env:SYNTHETIC -and $status.last.ok) { break }
                  } while ((Get-Date) -lt $deadline)
                  if ($status.version -ne $env:SYNTHETIC -or !$status.last.ok -or
                      $status.last.fromVersion -ne $env:VERSION -or $status.last.toVersion -ne $env:SYNTHETIC) {
                      throw 'No completed update on the new server'
                  }
                  if ($desktop.HasExited -or (ServerPid) -eq $before) { throw 'Expected the same desktop and a new server PID' }
                  if ((Get-Content -Raw "$env:FIXTURE\tarball-served") -ne $env:SYNTHETIC) { throw 'No fixture tarball transfer' }
                  $saved = Api sessions | Where-Object { $_.id -eq $session.id -and $_.title -eq $title }
                  if (!$saved -or (Api me).server.limitWaitHours -ne 12) { throw 'Session or setting did not survive' }
                  Write-Host 'New server verified the update outcome, saved session, and setting.'

            - name: Report only native module basenames on failure
              if: failure() && steps.desktop.outcome == 'failure'
              run: |
                  Write-Host "tarballServed=$(Test-Path (Join-Path $env:FIXTURE 'tarball-served'))"
                  Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$env:APP\node\node.exe" } | ForEach-Object {
                      $names = $_.Modules.ModuleName | Where-Object { $_ -match '^[a-zA-Z0-9_.-]+\.node$' } | Sort-Object -Unique
                      Write-Host "pid=$($_.Id) nativeModules=$($names -join ',')"
                  }

    checks:
        name: Type check and tests
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - run: npm run check

            # A part of the suite: the files known to pass on Windows, not yet the others. The browser tests are left
            # out: on the runner the browser can take longer than its 20 s limit to start (`browser/cdp.ts`).
            - name: Tests known to pass on Windows
              run: >
                  node --test --test-concurrency=4 --test-timeout=300000
                  --test-skip-pattern="a real sandbox loads relative CSS"
                  test/launcher-access.test.ts
                  test/launcher-coverage.test.ts
                  test/launcher-desktop.test.ts
                  test/lock.test.ts
                  test/npm-install.test.ts
                  test/npm-package.test.ts
                  test/npm-update.test.ts
                  test/zip.test.ts
                  test/diff-parse.test.ts
                  test/read-body.test.ts
                  test/quote-text.test.ts
                  test/timing.test.ts
                  test/deadlines.test.ts
                  test/background-platforms.test.ts
                  test/history.test.ts
                  test/signins.test.ts
                  test/shares.test.ts
                  test/skills.test.ts
                  test/prompts.test.ts
                  test/themes.test.ts
                  test/extension-loader.test.ts
                  test/dropin-no-link.test.ts
                  test/docs.test.ts
                  test/watch-tree.test.ts
                  test/folder-favorites.test.ts
                  test/person-storage.test.ts
                  test/artifact-bundles.test.ts
                  test/files.test.ts
                  test/worktrees.test.ts
                  test/download.test.ts
                  test/no-follow.test.ts
                  test/main.test.ts
