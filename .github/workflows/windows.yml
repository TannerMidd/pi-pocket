# Checks Pi Pocket on Windows for each pull request. It publishes nothing.
# - installer: builds the installer (packaging/windows) with a package packed from this checkout, installs it
#   silently, starts Pi Pocket without the interactive launcher, checks that it answers HTTP, and uninstalls it
#   while it runs, which must stop it and keep the data folder.
# - checks: the type check and the part of the test suite that is known to pass on Windows.
name: Windows

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: windows-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    installer:
        name: Installer (install, start, uninstall)
        runs-on: windows-latest
        timeout-minutes: 40
        defaults:
            run:
                shell: pwsh
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26

            - name: Pack this checkout
              run: |
                  $version = node -p "require('./package.json').version"
                  npm pack --pack-destination $env:RUNNER_TEMP
                  if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
                  "VERSION=$version" >> $env:GITHUB_ENV
                  "PACKAGE=$(Join-Path $env:RUNNER_TEMP "pi-pocket-$version.tgz")" >> $env:GITHUB_ENV
                  "APP=$(Join-Path $env:LOCALAPPDATA 'Pi Pocket')" >> $env:GITHUB_ENV

            - name: Build the installer
              run: ./packaging/windows/build.ps1 -Version $env:VERSION -OutDir (Join-Path $env:RUNNER_TEMP "setup")

            - name: Install silently
              run: |
                  $setup = Join-Path $env:RUNNER_TEMP "setup\Pi-Pocket-Setup-$env:VERSION.exe"
                  $log = Join-Path $env:RUNNER_TEMP "setup.log"
                  $run = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
                      "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$log", "/PACKAGE=$env:PACKAGE"
                  )
                  Get-Content (Join-Path $env:APP "install.log") -ErrorAction SilentlyContinue
                  if ($run.ExitCode -ne 0) {
                      Get-Content $log
                      throw "Setup exited with $($run.ExitCode)"
                  }
                  $expected = @(
                      "node\node.exe",
                      "node\npm.cmd",
                      "pi-pocket.cmd",
                      "app\node_modules\pi-pocket\bin\pi-pocket.js",
                      "unins000.exe"
                  )
                  foreach ($file in $expected) {
                      if (-not (Test-Path (Join-Path $env:APP $file))) { throw "Setup did not install $file" }
                  }
                  $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Pi Pocket.lnk"
                  if (-not (Test-Path $shortcut)) { throw "No Start menu shortcut at $shortcut" }
                  $startup = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Startup\Pi Pocket.lnk"
                  if (Test-Path $startup) { throw "The sign-in shortcut is there, but its task is off by default" }
                  & (Join-Path $env:APP "node\node.exe") --version

            - name: Start Pi Pocket and check that it answers HTTP
              run: |
                  $out = Join-Path $env:RUNNER_TEMP "pi-pocket.out.log"
                  $err = Join-Path $env:RUNNER_TEMP "pi-pocket.err.log"
                  $empty = Join-Path $env:RUNNER_TEMP "empty.txt"
                  New-Item -ItemType File -Force $empty | Out-Null
                  # Input from a file, not a terminal: the launcher asks nothing and prints no key menu.
                  Start-Process -FilePath (Join-Path $env:APP "pi-pocket.cmd") -WorkingDirectory $env:RUNNER_TEMP `
                      -ArgumentList @("--access", "local", "--yes", "--port", "8787") `
                      -RedirectStandardInput $empty -RedirectStandardOutput $out -RedirectStandardError $err
                  # The server answers 503 while it starts, then 200.
                  $answer = $null
                  for ($try = 0; $try -lt 180 -and ($null -eq $answer -or $answer.StatusCode -ge 500); $try++) {
                      Start-Sleep -Seconds 1
                      try {
                          $answer = Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
                      } catch {}
                  }
                  Get-Content $out, $err -ErrorAction SilentlyContinue
                  if ($null -eq $answer) { throw "Pi Pocket did not answer on http://127.0.0.1:8787/ in 180 seconds" }
                  Write-Host "GET / answered $($answer.StatusCode) after about $try seconds"
                  if ($answer.StatusCode -ge 500) { throw "GET / still answers $($answer.StatusCode) after 180 seconds" }
                  $login = Select-String -Path $out -Pattern 'http://127\.0\.0\.1:8787/\S*' -AllMatches |
                      ForEach-Object { $_.Matches.Value } | Where-Object { $_ -ne "http://127.0.0.1:8787" } | Select-Object -Last 1
                  if ($null -eq $login) { throw "The launcher printed no sign-in link" }
                  $session = Invoke-WebRequest -Uri $login -UseBasicParsing -TimeoutSec 10 -SkipHttpErrorCheck -MaximumRedirection 0
                  Write-Host "The sign-in link answered $($session.StatusCode)"
                  if ($session.StatusCode -ge 400) { throw "The sign-in link answered $($session.StatusCode)" }

            - name: Uninstall silently while Pi Pocket runs
              run: |
                  $run = Start-Process -FilePath (Join-Path $env:APP "unins000.exe") -Wait -PassThru -ArgumentList @(
                      "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
                  )
                  if ($run.ExitCode -ne 0) { throw "The uninstaller exited with $($run.ExitCode)" }
                  # The uninstaller runs a copy of itself from the temp folder, which may still be at work.
                  for ($try = 0; $try -lt 60 -and (Test-Path $env:APP); $try++) { Start-Sleep -Seconds 1 }
                  if (Test-Path $env:APP) {
                      Get-ChildItem -Recurse $env:APP | Select-Object -First 50 FullName
                      throw "The uninstaller left $env:APP"
                  }
                  $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Pi Pocket.lnk"
                  if (Test-Path $shortcut) { throw "The uninstaller left the Start menu shortcut" }
                  $left = @(Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:APP\*" })
                  if ($left.Count -gt 0) { throw "Pi Pocket still runs after the uninstall" }
                  try {
                      Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -UseBasicParsing -TimeoutSec 5 | Out-Null
                      throw "Port 8787 still answers after the uninstall"
                  } catch [System.Net.Http.HttpRequestException] {}
                  $data = Join-Path $env:USERPROFILE ".pi-pocket"
                  if (-not (Test-Path $data)) { throw "A silent uninstall must keep the data folder $data" }
                  Write-Host "Uninstalled; the data folder $data stays."

            - name: Show the logs
              if: failure()
              run: |
                  Get-Content (Join-Path $env:RUNNER_TEMP "setup.log") -ErrorAction SilentlyContinue
                  Get-ChildItem $env:TEMP -Filter "Setup Log*.txt" -ErrorAction SilentlyContinue | Get-Content
                  Get-Content (Join-Path $env:RUNNER_TEMP "pi-pocket.out.log"), (Join-Path $env:RUNNER_TEMP "pi-pocket.err.log") -ErrorAction SilentlyContinue

    checks:
        name: Type check and tests
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm

            - run: npm ci

            - run: npm run check

            # A part of the suite. The rest is not yet known to pass on Windows. The skipped tests fail on Windows
            # (pull request #354 lists why): take one out of the list when it passes there.
            - name: Tests known to pass on Windows
              run: >
                  node --test --test-concurrency=4
                  --test-skip-pattern="limits and invalid sources fail without publishing"
                  --test-skip-pattern="a session file downloads as it is"
                  --test-skip-pattern="a download needs a sign-in, a file"
                  --test-skip-pattern="a live holder under a name that is not node"
                  --test-skip-pattern="an update state folder that the server cannot write"
                  --test-skip-pattern="npm stages a real offline tarball"
                  --test-skip-pattern="npm ignores the dot sibling"
                  --test-skip-pattern="a session lists them as /skill: commands"
                  --test-skip-pattern="a session in its own worktree starts with the folder"
                  --test-skip-pattern="a worktree another session works in stays"
                  test/launcher-access.test.ts
                  test/launcher-coverage.test.ts
                  test/lock.test.ts
                  test/npm-install.test.ts
                  test/npm-package.test.ts
                  test/npm-update.test.ts
                  test/zip.test.ts
                  test/diff-parse.test.ts
                  test/read-body.test.ts
                  test/quote-text.test.ts
                  test/timing.test.ts
                  test/deadlines.test.ts
                  test/history.test.ts
                  test/signins.test.ts
                  test/shares.test.ts
                  test/skills.test.ts
                  test/prompts.test.ts
                  test/themes.test.ts
                  test/extension-loader.test.ts
                  test/docs.test.ts
                  test/watch-tree.test.ts
                  test/download.test.ts
                  test/folder-favorites.test.ts
                  test/person-storage.test.ts
                  test/artifact-bundles.test.ts
                  test/files.test.ts
                  test/worktrees.test.ts
                  test/main.test.ts
