<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Toggles</title>
        <style>
            body {
                margin: 0;
                font: 16px/1.5 system-ui;
                background: #fafafa;
                color: #1f2430;
            }
            .list {
                max-width: 480px;
                margin: 24px auto;
                background: #fff;
                border-radius: 12px;
                overflow: hidden;
            }
            .row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px;
                border-bottom: 1px solid #e6e8ee;
                min-height: 56px;
            }
            .sw {
                position: relative;
                width: 48px;
                height: 28px;
            }
            .sw input {
                position: absolute;
                inset: 0;
                opacity: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                cursor: pointer;
            }
            .sw span {
                position: absolute;
                inset: 0;
                background: #8a93a6;
                border-radius: 14px;
                transition: 0.2s;
            }
            .sw span::after {
                content: "";
                position: absolute;
                top: 3px;
                left: 3px;
                width: 22px;
                height: 22px;
                background: #fff;
                border-radius: 50%;
                transition: 0.2s;
            }
            .sw input:checked + span {
                background: #1a56db;
            }
            .sw input:checked + span::after {
                left: 23px;
            }
            .sw input:focus-visible + span {
                outline: 3px solid #1a56db;
                outline-offset: 2px;
            }
            .d {
                color: #4d5567;
                font-size: 14px;
            }
        </style>
    </head>
    <body>
        <div class="list" data-pid="list">
            <div class="row">
                <div>
                    <div>Notifications</div>
                    <div class="d">Push to this device</div>
                </div>
                <label class="sw"
                    ><input type="checkbox" checked aria-label="Notifications" /><span></span
                ></label>
            </div>
            <div class="row">
                <div>Dark mode</div>
                <label class="sw"
                    ><input type="checkbox" aria-label="Dark mode" /><span></span
                ></label>
            </div>
        </div>
    </body>
</html>
