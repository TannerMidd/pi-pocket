<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Form</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font: 16px/1.5 system-ui;
                background: #f4f5f7;
                color: #1a1d23;
            }
            form {
                max-width: 480px;
                margin: 24px auto;
                background: #fff;
                padding: 24px;
                border-radius: 12px;
                display: grid;
                gap: 16px;
            }
            label {
                display: grid;
                gap: 6px;
                font-weight: 600;
                font-size: 14px;
            }
            input,
            select,
            textarea {
                font: inherit;
                min-height: 44px;
                padding: 8px 12px;
                border: 1px solid #6b7280;
                border-radius: 8px;
                background: #fff;
                color: #1a1d23;
            }
            textarea {
                min-height: 96px;
            }
            input:focus-visible,
            select:focus-visible,
            textarea:focus-visible {
                outline: 3px solid #2563eb;
                outline-offset: 1px;
            }
            .hint {
                font-weight: 400;
                color: #4b5563;
            }
            .err {
                color: #b91c1c;
            }
            fieldset {
                border: 1px solid #d1d5db;
                border-radius: 8px;
                padding: 12px;
            }
            .opt {
                display: flex;
                align-items: center;
                gap: 8px;
                min-height: 44px;
            }
            .opt input {
                min-height: 0;
                width: 20px;
                height: 20px;
            }
            button {
                min-height: 44px;
                border: 0;
                border-radius: 8px;
                background: #1d4ed8;
                color: #fff;
                font: inherit;
                font-weight: 600;
            }
            button:focus-visible {
                outline: 3px solid #1a1d23;
                outline-offset: 2px;
            }
            button[disabled] {
                background: #cbd5e1;
                color: #64748b;
            }
        </style>
    </head>
    <body>
        <form data-pid="form">
            <h1 style="margin: 0; font-size: 22px" data-pid="h">Create account</h1>
            <label>Name<input type="text" placeholder="Jane Doe" data-pid="n" /></label
            ><label
                >Email<input type="email" aria-describedby="e" data-pid="e" /><span
                    class="hint"
                    id="e"
                    >We never share it.</span
                ></label
            >
            <label
                >Country<select data-pid="c">
                    <option>Norway</option>
                    <option>Peru</option>
                </select></label
            ><label>Bio<textarea data-pid="b"></textarea></label>
            <fieldset>
                <legend>Plan</legend>
                <label class="opt"><input type="radio" name="p" checked /> Free</label
                ><label class="opt"><input type="radio" name="p" /> Pro</label>
            </fieldset>
            <label class="opt"
                ><input type="checkbox" /> I agree to the <a href="#">terms</a></label
            >
            <p class="err" role="alert">Email is required.</p>
            <button type="submit" data-pid="go">Sign up</button
            ><button type="button" disabled data-pid="off">Later</button>
        </form>
    </body>
</html>
