<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Bootstrap-like</title>
        <style>
            *,
            ::before,
            ::after {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font:
                    400 1rem/1.5 -apple-system,
                    "Segoe UI",
                    Roboto,
                    "Helvetica Neue",
                    Arial,
                    sans-serif;
                color: #212529;
                background: #fff;
            }
            .container {
                width: 100%;
                max-width: 960px;
                margin: 0 auto;
                padding: 0 12px;
            }
            .navbar {
                background: #212529;
                padding: 8px 0;
            }
            .navbar a {
                color: rgba(255, 255, 255, 0.85);
                text-decoration: none;
                display: inline-block;
                padding: 11px 12px;
            }
            .navbar .brand {
                color: #fff;
                font-size: 1.25rem;
            }
            .btn {
                display: inline-block;
                padding: 0.375rem 0.75rem;
                font-size: 1rem;
                line-height: 1.5;
                border: 1px solid transparent;
                border-radius: 0.375rem;
                cursor: pointer;
                min-height: 44px;
            }
            .btn-primary {
                color: #fff;
                background: #0d6efd;
                border-color: #0d6efd;
            }
            .btn-outline {
                color: #0d6efd;
                border-color: #0d6efd;
                background: transparent;
            }
            .card {
                border: 1px solid rgba(0, 0, 0, 0.175);
                border-radius: 0.375rem;
                background: #fff;
                margin-bottom: 16px;
            }
            .card-body {
                padding: 16px;
            }
            .card-title {
                margin: 0 0 8px;
                font-size: 1.25rem;
            }
            .text-muted {
                color: #6c757d;
            }
            .alert {
                padding: 16px;
                border: 1px solid #b6d4fe;
                border-radius: 0.375rem;
                color: #052c65;
                background: #cfe2ff;
                margin: 16px 0;
            }
            .badge {
                display: inline-block;
                padding: 0.35em 0.65em;
                font-size: 0.75em;
                font-weight: 700;
                color: #fff;
                background: #198754;
                border-radius: 0.375rem;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th,
            td {
                padding: 8px;
                border-bottom: 1px solid #dee2e6;
                text-align: left;
            }
            .table-striped tr:nth-child(even) td {
                background: rgba(0, 0, 0, 0.05);
            }
        </style>
    </head>
    <body>
        <nav class="navbar" data-pid="nav">
            <div class="container">
                <a class="brand" href="#">Brand</a><a href="#">Home</a><a href="#">Features</a>
            </div>
        </nav>
        <div class="container" data-pid="body">
            <h1 data-pid="h1">Dashboard</h1>
            <div class="alert" data-pid="alert">Heads up: maintenance on Friday.</div>
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title">Plan</h2>
                    <p class="text-muted">
                        You are on the free plan. <span class="badge">Active</span>
                    </p>
                    <button class="btn btn-primary" data-pid="up">Upgrade</button>
                    <button class="btn btn-outline" data-pid="cmp">Compare</button>
                </div>
            </div>
            <table class="table-striped" data-pid="tbl">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tr>
                    <td>Alpha</td>
                    <td>Ok</td>
                </tr>
                <tr>
                    <td>Beta</td>
                    <td>Ok</td>
                </tr>
                <tr>
                    <td>Gamma</td>
                    <td>Late</td>
                </tr>
            </table>
        </div>
    </body>
</html>
