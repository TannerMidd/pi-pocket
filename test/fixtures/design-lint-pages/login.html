<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Login</title>
        <style>
            :root {
                --bg: #eef1f6;
                --card: #fff;
                --ink: #14171f;
                --mute: #4a5160;
                --line: #8b93a3;
                --accent: #1f4fd8;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0e1118;
                    --card: #171b25;
                    --ink: #eef1f7;
                    --mute: #aab2c3;
                    --line: #68718a;
                    --accent: #8fb0ff;
                }
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: var(--bg);
                color: var(--ink);
                font: 16px/1.5 system-ui;
            }
            .card {
                width: min(360px, 92vw);
                background: var(--card);
                padding: 28px;
                border-radius: 16px;
                display: grid;
                gap: 14px;
            }
            h1 {
                margin: 0;
                font-size: 22px;
            }
            p {
                margin: 0;
                color: var(--mute);
            }
            input {
                min-height: 44px;
                padding: 0 12px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: transparent;
                color: var(--ink);
                font: inherit;
            }
            input:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 1px;
            }
            button {
                min-height: 44px;
                border: 0;
                border-radius: 10px;
                background: var(--accent);
                color: var(--bg);
                font: inherit;
                font-weight: 700;
            }
            a {
                color: var(--accent);
                display: inline-block;
                padding: 10px 0;
            }
        </style>
    </head>
    <body>
        <main class="card" data-pid="card">
            <h1 data-pid="h">Welcome back</h1>
            <p data-pid="s">Sign in to continue.</p>
            <input type="email" placeholder="Email" aria-label="Email" data-pid="e" /><input
                type="password"
                placeholder="Password"
                aria-label="Password"
                data-pid="p"
            /><button data-pid="go">Sign in</button><a href="#" data-pid="f">Forgot password?</a>
        </main>
    </body>
</html>
