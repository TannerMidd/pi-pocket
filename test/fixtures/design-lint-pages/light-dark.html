<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>light-dark</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                background: light-dark(#fff, #111318);
                color: light-dark(#15171c, #eceff4);
                font: 16px/1.5 system-ui;
            }
            main {
                max-width: 600px;
                margin: 0 auto;
                padding: 24px;
                display: grid;
                gap: 12px;
            }
            .card {
                background: light-dark(#f2f4f8, #1b1f29);
                border-radius: 12px;
                padding: 16px;
            }
            a {
                color: light-dark(#1a4fd1, #9db8ff);
                display: inline-flex;
                align-items: center;
                min-height: 44px;
            }
            .pill {
                display: inline-block;
                padding: 2px 10px;
                border-radius: 99px;
                background: light-dark(#dbe7ff, #243a6b);
                color: light-dark(#0b2a73, #dbe7ff);
                font-size: 13px;
            }
        </style>
    </head>
    <body>
        <main data-pid="m">
            <h1 data-pid="h">light-dark()</h1>
            <div class="card" data-pid="c">
                <span class="pill">Beta</span>
                <p>Uses the color-scheme property.</p>
                <a href="#" data-pid="a">Read more</a>
            </div>
        </main>
    </body>
</html>
