<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Newsletter</title>
        <style>
            body {
                margin: 0;
                background: #eeeeee;
                font:
                    16px/1.5 Arial,
                    Helvetica,
                    sans-serif;
                color: #333;
            }
            table {
                border-collapse: collapse;
            }
            .wrap {
                max-width: 600px;
                margin: 0 auto;
                background: #fff;
            }
            .hd {
                background: #003366;
                color: #fff;
                padding: 24px;
                font-size: 24px;
            }
            .bd {
                padding: 24px;
            }
            .ft {
                background: #f4f4f4;
                color: #666;
                font-size: 12px;
                padding: 16px;
                text-align: center;
            }
            .bt {
                display: inline-block;
                background: #cc3300;
                color: #fff;
                padding: 14px 28px;
                text-decoration: none;
                border-radius: 4px;
                min-height: 44px;
            }
        </style>
    </head>
    <body>
        <table class="wrap" width="100%" data-pid="wrap">
            <tr>
                <td class="hd">Weekly digest</td>
            </tr>
            <tr>
                <td class="bd">
                    <h1 style="font-size: 20px; margin: 0 0 12px">Three things worth reading</h1>
                    <p>One, two, and three.</p>
                    <p><a class="bt" href="#">Read now</a></p>
                </td>
            </tr>
            <tr>
                <td class="ft">
                    You get this because you subscribed.
                    <a href="#" style="color: #666">Unsubscribe</a>
                </td>
            </tr>
        </table>
    </body>
</html>
