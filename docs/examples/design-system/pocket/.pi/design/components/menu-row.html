<style>
    .pk-menu {
        display: grid;

        background: var(--menu-bg);
        box-shadow: var(--menu-shadow);

    .pk-menu__row {
        display: flex;

    .pk-menu__row:hover,
    .pk-menu__row.is-hover {
        background: var(--menu-row-hover);
    }

    .pk-menu__row[aria-checked="true"] {
        background: var(--menu-row-selected);
        color: var(--color-accent-default);
    }

    .pk-menu__row:focus-visible,
    .pk-menu__row.is-focus {

        box-shadow: var(--shadow-focus-ring);
    }

    .pk-menu__row:disabled {
